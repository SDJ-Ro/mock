# Runs the rule check on every pull request and every push to dev and main.
# A pull request with a red ✗ here is not merged.
name: Rule check

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: bin/check.sh (0 errors)
        working-directory: code_lecole
        run: bash bin/check.sh
