# The database — start it with:  docker compose up -d
services:
  db:
    image: mysql:8.0
    ports:
      - "3308:3306"        # Mac port 3308 → MySQL's port 3306 inside the container
    environment:
      MYSQL_DATABASE: l_ecole
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql                                          # keeps your data when the container stops
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql  # runs automatically, first start only
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql      # then this one

  phpmyadmin:              # see the database in your browser: http://localhost:8086
    image: phpmyadmin/phpmyadmin
    ports:
      - "8086:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
